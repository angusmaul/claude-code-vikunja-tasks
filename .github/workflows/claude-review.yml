name: Claude privacy and code review

# A second reviewer next to CodeRabbit, with no hourly cap. It runs on the Claude subscription via
# CLAUDE_CODE_OAUTH_TOKEN, so every run draws on the same allowance as interactive Claude Code.
#
# Like CodeRabbit, this is a second layer and not the gate: a pushed branch in a public repo is
# already public, so the scrub happens before the push.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review of the previous one, so only the latest head is reviewed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are skipped to save allowance. Fork PRs get no secrets, so skip them cleanly.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read the diff with `gh pr diff` and the files it touches.

            1. PRIVACY AND SECRETS REVIEW (the main job). This code was written against a private,
               self-hosted task tracker and scrubbed before publishing. Flag, as a blocking issue,
               anything that identifies the owner, their network or their tracker, or that grants
               access:
               - Credentials of any kind: tokens, API keys, passwords, bearer headers, long
                 random-looking strings.
               - Private network details: private IPs (192.168.x.x, 10.x.x.x, 172.16-31.x.x), ports
                 tied to a specific host, .local hostnames, personal domain names or subdomains.
               - Personal identifiers: email addresses, people's names other than the licence
                 holder, local user names, absolute paths under a user's home directory, real
                 project or task titles from the owner's tracker.
               Example values in the README (tasks.example.com, /home/me/code) and in the test's
               fake tracker are expected and fine.

            2. hooks/register.tsx is a Claude Code function-hooks plugin that reads a Vikunja server
               with a bearer token from the environment. Check: the token can never reach the
               screen, a log, a toast, the status line or an error message; no default server
               address is baked in; the only writes to Vikunja are creating a "folder: <path>"
               label and adding or removing it on a task, never a task update; a folder can only
               be created directly under the configured root (no path separators or traversal in
               the name); and no Select is ever given more than 64 options.

            3. READMEs: check the claims match the code next to them: the environment variables,
               the option names, what the mod reads and writes, and what is and is not proven.
               Flag any claim of "tested" or "proven" the README doesn't back up.

            4. Ordinary code review: report real bugs and logic errors in the changed code.

            Report each finding as an inline comment on the line it concerns. Then post one
            top-level comment with `gh pr comment` that starts with either "BLOCKING" or
            "NO BLOCKING ISSUES" and lists the findings in one line each. If you quote a suspected
            secret, show only its first four characters. Do not comment on style.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
